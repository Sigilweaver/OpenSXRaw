[workspace]
resolver = "2"
members = ["crates/opensxraw", "crates/opensxraw-py"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
authors = ["Nathan Riley <git@nathanriley.com>"]
license = "Apache-2.0"
repository = "https://github.com/Sigilweaver/OpenSXRaw"
homepage = "https://sigilweaver.app/opensxraw/"
documentation = "https://sigilweaver.app/opensxraw/docs/"
keywords = ["mass-spectrometry", "sciex", "wiff", "raw", "proteomics"]
categories = ["parser-implementations", "science"]

[workspace.dependencies]
opensxraw = { path = "crates/opensxraw" }
openmassspec-core = "4.0.0"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

# Pinned to a Core commit until openmassspec-core 4.0.0 is on crates.io. Remove
# this section when it is.
[patch.crates-io]
openmassspec-core = { git = "https://github.com/Sigilweaver/OpenMassSpecCore", rev = "ab7b7f7851cc26e518688d04a144c7fc0c42afd5" }
