# CI for OpenSXRaw.
#
# Jobs:
#   build - cargo fmt --check, cargo clippy -D warnings, cargo test
#           (Linux + macOS + Windows, mirroring publish.yml's wheel matrix)
#           Downloads a small corpus fixture (the PXD022088/Rcor2KOESC1
#           `.wiff` + `.wiff.scan` pair) ahead of `cargo test` so
#           crates/opensxraw/tests/conformance.rs exercises a real decode
#           path instead of always skipping - see Sigilweaver/OpenSXRaw#33.
#           OPENSXRAW_CORPUS points the tests at that directory and
#           REQUIRE_CORPUS=1 turns a missing fixture into a failure.
#   semver-checks - cargo-semver-checks on opensxraw against its latest
#           crates.io release (Linux only).

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Download corpus fixture for conformance tests
        shell: bash
        run: |
          mkdir -p corpus/PXD022088
          curl -fsSL --retry 3 --user-agent "OpenSXRaw-CI/1.0" \
            -o corpus/PXD022088/Rcor2KOESC1.wiff \
            "https://ftp.pride.ebi.ac.uk/pride/data/archive/2020/12/PXD022088/Rcor2KOESC1.wiff"
          curl -fsSL --retry 3 --user-agent "OpenSXRaw-CI/1.0" \
            -o corpus/PXD022088/Rcor2KOESC1.wiff.scan \
            "https://ftp.pride.ebi.ac.uk/pride/data/archive/2020/12/PXD022088/Rcor2KOESC1.wiff.scan"
          echo "Downloaded $(du -sh corpus/PXD022088/Rcor2KOESC1.wiff | cut -f1) .wiff + $(du -sh corpus/PXD022088/Rcor2KOESC1.wiff.scan | cut -f1) .wiff.scan"

      - name: cargo test
        env:
          OPENSXRAW_CORPUS: ${{ github.workspace }}/corpus
          REQUIRE_CORPUS: "1"
        run: cargo test --workspace --all-targets

      - name: Python binding parity
        if: matrix.os == 'ubuntu-latest'
        env:
          OPENSXRAW_CORPUS: ${{ github.workspace }}/corpus
          REQUIRE_CORPUS: "1"
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install 'maturin>=1.5,<2' pytest
          VIRTUAL_ENV="$PWD/.venv" .venv/bin/maturin develop --release
          OPENSXRAW_TEST_WIFF=corpus/PXD022088/Rcor2KOESC1.wiff .venv/bin/python -m pytest tests/test_bindings.py -v

  docs:
    name: Docs (Docusaurus)
    permissions:
      contents: read
    uses: Sigilweaver/ops/.github/workflows/docs.yml@c2f3734fca95d586bf4203ef484f37a6190eb618
    with:
      tooling-ref: c2f3734fca95d586bf4203ef484f37a6190eb618
  # Public API compatibility of the crates.io-published crate against its
  # latest published version. A breaking change without a matching version
  # bump fails; a deliberate major bump passes. OS-independent, so Linux only.
  semver-checks:
    name: Semver checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: cargo semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: opensxraw
