# CI for OpenSXRaw.
#
# Jobs:
#   build - cargo fmt --check, cargo clippy -D warnings, cargo test
#           (Linux + macOS + Windows, mirroring publish.yml's wheel matrix)
#           Downloads a small corpus fixture (the PXD022088/Rcor2KOESC1
#           `.wiff` + `.wiff.scan` pair) ahead of `cargo test` so
#           crates/opensxraw/tests/conformance.rs exercises a real decode
#           path instead of always skipping - see Sigilweaver/OpenSXRaw#33.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Download corpus fixture for conformance tests
        shell: bash
        run: |
          mkdir -p corpus/PXD022088
          curl -sSL --user-agent "OpenSXRaw-CI/1.0" \
            -o corpus/PXD022088/Rcor2KOESC1.wiff \
            "https://ftp.pride.ebi.ac.uk/pride/data/archive/2020/12/PXD022088/Rcor2KOESC1.wiff"
          curl -sSL --user-agent "OpenSXRaw-CI/1.0" \
            -o corpus/PXD022088/Rcor2KOESC1.wiff.scan \
            "https://ftp.pride.ebi.ac.uk/pride/data/archive/2020/12/PXD022088/Rcor2KOESC1.wiff.scan"
          echo "Downloaded $(du -sh corpus/PXD022088/Rcor2KOESC1.wiff | cut -f1) .wiff + $(du -sh corpus/PXD022088/Rcor2KOESC1.wiff.scan | cut -f1) .wiff.scan"

      - name: cargo test
        run: cargo test --workspace --all-targets

  docs:
    name: Docs (Docusaurus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: bun install
        run: bun install --frozen-lockfile
      - name: bun run build:cloudflare
        run: bun run build:cloudflare
